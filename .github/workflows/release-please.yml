name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Разбирает историю коммитов по Conventional Commits и держит открытым
      # release-PR: changelog и следующая версия по semver считаются сами.
      # Мёрдж этого PR создаёт тег и релиз.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
