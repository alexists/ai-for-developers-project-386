name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    name: Формат коммитов
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # По Conventional Commits release-please считает версию и собирает
      # changelog, поэтому нарушение формата ломает релиз, а не только стиль.
      # Заголовки на русском, поэтому длина считается в символах: LANG=C.UTF-8.
      - name: Заголовки коммитов по Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LANG: C.UTF-8
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9-]+\))?!?: .+$'
          failed=0

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue

            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::не по Conventional Commits: $subject"
              failed=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::error::заголовок длиннее 72 символов: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")

          exit $failed

  contract:
    name: Контракт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      # openapi.yaml коммитится вместе с main.tsp: пересборка не должна его менять.
      - name: Спецификация собрана из main.tsp
        working-directory: api
        run: |
          npx tsp compile .
          git diff --exit-code -- openapi/openapi.yaml

  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run build
        working-directory: backend

      - run: npm run lint
        working-directory: backend

      - run: npm test
        working-directory: backend

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  e2e:
    name: Интеграционные сценарии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          # В корне репозитория package-lock.json нет: пакеты лежат по папкам.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Установить зависимости
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Собрать приложение
        run: npm run build:app --prefix e2e

      - name: Установить браузер
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Прогнать сценарии
        run: npm test --prefix e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Собрать образ
        run: docker build -t simple-booking:ci .

      # Платформа деплоя подставляет свой порт через PORT, поэтому проверяем
      # не значение по умолчанию из Dockerfile, а именно чтение переменной.
      - name: Проверить, что контейнер отвечает на порту из PORT
        run: |
          docker run -d --name booking-ci -e PORT=10000 -p 10000:10000 simple-booking:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:10000/api/public/owner > /dev/null; then
              echo "Приложение отвечает"
              curl -sf http://127.0.0.1:10000/ > /dev/null && echo "Статика отдаётся"
              docker rm -f booking-ci
              exit 0
            fi
            sleep 2
          done
          echo "Контейнер не поднялся"
          docker logs booking-ci
          exit 1
