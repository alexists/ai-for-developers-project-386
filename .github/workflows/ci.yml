name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Контракт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      # openapi.yaml коммитится вместе с main.tsp: пересборка не должна его менять.
      - name: Спецификация собрана из main.tsp
        working-directory: api
        run: |
          npx tsp compile .
          git diff --exit-code -- openapi/openapi.yaml

  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run build
        working-directory: backend

      - run: npm run lint
        working-directory: backend

      - run: npm test
        working-directory: backend

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  e2e:
    name: Интеграционные сценарии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Установить зависимости
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Собрать приложение
        run: npm run build:app --prefix e2e

      - name: Установить браузер
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Прогнать сценарии
        run: npm test --prefix e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Собрать образ
        run: docker build -t simple-booking:ci .

      - name: Проверить, что контейнер отвечает
        run: |
          docker run -d --name booking-ci -p 8080:8080 simple-booking:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/public/owner > /dev/null; then
              echo "Приложение отвечает"
              curl -sf http://127.0.0.1:8080/ > /dev/null && echo "Статика отдаётся"
              docker rm -f booking-ci
              exit 0
            fi
            sleep 2
          done
          echo "Контейнер не поднялся"
          docker logs booking-ci
          exit 1
